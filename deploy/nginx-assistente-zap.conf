# Proxy HTTP + WebSocket para o backend do Assistente do Zap.
# O backend escuta em 127.0.0.1:3000; o Nginx publica na porta 80.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Nao registra a query string: o token do WebSocket vai em ?token=...
log_format zap_no_token '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads de midia (audio/imagem) via API
    client_max_body_size 40m;
    client_body_timeout 120s;

    access_log /var/log/nginx/assistente-zap.access.log zap_no_token;
    error_log  /var/log/nginx/assistente-zap.error.log;

    # WebSocket de eventos ao vivo
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
